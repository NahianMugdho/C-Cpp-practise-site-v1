    <script>
      // 404.html থেকে আসা ?/path আবার সুন্দর URL-এ ফিরিয়ে আনে (অবশ্যই body-র শেষে — যাতে CSS/JS-এর পাথ আগেই ঠিকভাবে ধরা হয়)
      (function (l) {
        if (l.search[1] === '/') {
          var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&') }).join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + d + l.hash)
        }
      })(window.location)
    </script>
